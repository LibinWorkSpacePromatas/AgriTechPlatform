<section class="section">
  <h2>Requests</h2>
  <p *ngIf="loading">Loading requests...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="cards">
    <article class="card" *ngFor="let booking of requests">
      <h3>{{ booking.equipment_name || booking.listing_id }}</h3>
      <p>Renter: {{ booking.renter_name || booking.renter_id }}</p>
      <p>{{ booking.start_datetime | date:'short' }} - {{ booking.end_datetime | date:'short' }}</p>
      <p>Status: <strong [ngClass]="getStatusClass(booking.status)">{{ booking.status }}</strong></p>
      <div class="actions" *ngIf="booking.status === 'pending'">
        <button class="btn btn-primary" (click)="approve(booking)">Approve</button>
        <button class="btn btn-outline" (click)="reject(booking)">Reject</button>
      </div>
    </article>
  </div>
</section>
