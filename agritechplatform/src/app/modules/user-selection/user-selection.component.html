<div class="user-selection-container">
    <!-- Header Section -->
    <div class="header-section">
        <div class="logo-container">
            <i-lucide [img]="LeafIcon" size="36" class="logo-icon" style="color: #2e7d32;"></i-lucide>
            <div class="logo-text">
                <h1>Promasecure</h1>
                <p>AgriTech Platform</p>
            </div>
        </div>
    </div>

    <!-- Welcome Section -->
    <div class="welcome-section">
        <h2>Welcome Back</h2>
        <p class="subtitle">Select your profile to continue</p>

        <!-- Loading State -->
        <div *ngIf="isLoading" class="loading-state">
            <div class="spinner"></div>
            <p>Fetching your profiles...</p>
        </div>

        <!-- Error State -->
        <div *ngIf="errorMessage && !isLoading" class="error-container">
            <p class="error-text">{{ errorMessage }}</p>
            <button (click)="ngOnInit()" class="retry-button">Retry Connection</button>
        </div>

        <!-- User Grid -->
        <div *ngIf="!isLoading && users.length > 0" class="user-grid">
            <div *ngFor="let user of users; let i = index" class="user-card" (click)="selectUser(user)"
                [style.--bg-color]="getAvatarColor(i)">
                <div class="user-avatar" [style.background]="getAvatarColor(i)">
                    {{ getInitials(user.userName) }}
                </div>
                <div class="user-info">
                    <h3>{{ user.userName }}</h3>
                    <p class="farm-name">{{ user.farmName }}</p>
                    <p class="location">{{ user.farmLocation }} • {{ user.primaryCropName }}</p>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="!isLoading && users.length === 0 && !errorMessage" class="empty-state">
            <p>No user profiles found in the database.</p>
        </div>
    </div>
</div>
